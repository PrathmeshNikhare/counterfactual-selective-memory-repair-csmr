# All tunables for CSMR. No magic numbers in code (CLAUDE.md rule 6).

seed: 42

llm:
  model: "openai/gpt-oss-20b"        # any OpenAI-compatible model name; base_url/key come from .env
  judge_model: null                     # null = same as model
  temperature: 0
  max_retries: 4
  cache_dir: ".cache/llm"

models:
  embedder: "sentence-transformers/all-MiniLM-L6-v2"
  nli: "cross-encoder/nli-deberta-v3-small"

# Phase A
extract_max_tokens: 2048   # reasoning model can exhaust 512 before emitting JSON
root_nli_threshold: 0.8

# Phase B
top_k: 10
max_hops: 2
hop_sim: 0.35
topk_min_sim: 0.35   # top-K metadata filter: same entity AND (same attribute OR cosine >= this)

# Phase C thresholds
tau_d: 0.5          # dependency threshold
tau_e: 0.6          # evidence sufficiency threshold (paper τe)

# Hand-set starting weights (logistic regression). Replaced by models/*.json after fit().
# Tuning these on data/dev is allowed until the dataset exists.
dependency_weights:
  intercept: -3.0
  cos_sim: 1.0
  same_entity: 0.2
  same_attribute: 1.5
  nli_entail: 1.0
  nli_contra_new: 2.0
  temporal_after: 0.2
  same_source: 0.1
  causal_cue: 3.0
  hop_closeness: 1.0

evidence_weights:
  intercept: -14.5
  source_reliability: 1.5
  directness: 5.0
  contradiction_strength: 3.0
  not_hedged: 3.0
  not_temporary: 5.0
  corroboration: 0.5
  extraction_conf: 1.0
  freshness: 0.5

source_reliability:
  user: 0.9
  tool: 0.8
  third_party: 0.5
  inferred: 0.3

source_reliability_default: 0.0   # unknown source

# hop -> value (SPEC §4/§5); hops not listed (e.g. top-K-only) use hop_default
hop_closeness: {0: 1.0, 1: 0.6, 2: 0.3}
directness: {0: 1.0, 1: 0.6, 2: 0.3}
hop_default: 0.3
corroboration_cap: 3

hedge_patterns: ["\\bmight\\b", "\\bmaybe\\b", "thinking of", "planning to", "not sure", "\\bprobably\\b", "considering"]
temporary_patterns: ["this week", "for now", "temporarily", "\\buntil\\b", "for a few days", "for a week", "at the moment"]

# Phase D objective (paper Section V)
n_probes: 6
lambda_c: 0.5       # collateral
lambda_e: 0.1       # evidence cost
lambda_s: 0.05      # repair size
verify_cost: 0.1
call_cost: 0.0
tie_eps: 1.0e-6        # totals within this are tied -> smaller |R| wins
probe_max_tokens: 2048  # reasoning model needs headroom before the JSON
judge_max_tokens: 1024
validation_tol: 0.01   # Phase E: warn if |committed benefit - expected| exceeds this
r4_min_pdep: 0.2

# Downstream agent
agent_top_k: 5
agent_max_tokens: 1024   # one retry with double this if the answer is empty
unknown_max_words: 12   # longer answers count as unknown-like only if they START with an unknown pattern
unknown_patterns: ["\\bunknown\\b", "not sure", "cannot determine", "can't determine", "cannot be determined",
                   "it is uncertain", "\\buncertain\\b", "do(es)? not know", "no information"]

# Ablations (paper VIII): each flag swaps a stage for its trivial default
ablation:
  use_dependency: true
  use_evidence: true
  use_counterfactual: true
  use_minimality: true

# Baselines
sim_prop_threshold: 0.4
